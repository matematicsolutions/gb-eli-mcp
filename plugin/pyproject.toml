# Runtime of the Claude plugin: pins gb-eli-mcp and every transitive dependency
# (with hashes) in uv.lock, so the plugin runs exactly what was reviewed.
# Started by plugin.json as: uvx gb-eli-mcp==0.5.3 (Claude Code's locked launch reads this uv.lock)
[project]
name = "gb-eli-mcp-plugin-runtime"
version = "0.5.3"
requires-python = ">=3.11,<3.14"
dependencies = ["gb-eli-mcp==0.5.3"]

[tool.uv]
package = false
